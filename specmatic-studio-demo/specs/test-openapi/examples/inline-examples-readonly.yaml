openapi: 3.0.0
info:
  title: Inline Examples Readonly API
  version: "1.0.0"
paths:
  /create-orders:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, item]
              properties:
                customerId:
                  type: integer
                item:
                  type: string
            examples:
              CREATE_SUCCESS:
                value:
                  customerId: 7
                  item: keyboard
              CREATE_INVALID:
                value:
                  customerId: invalid
                  item: keyboard
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id:
                    type: integer
                  status:
                    type: string
              examples:
                CREATE_SUCCESS:
                  value:
                    id: 303
                    status: created
                CREATE_INVALID:
                  value:
                    id: invalid
                    status: created
  /orders:
    get:
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
          examples:
            SUCCESS:
              value: 101
      responses:
        "200":
          description: Order found
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id:
                    type: integer
                  status:
                    type: string
              examples:
                SUCCESS:
                  value:
                    id: 101
                    status: created
  /products:
    get:
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
          examples:
            SUCCESS:
              value: 202
      responses:
        "200":
          description: Product found
          content:
            application/json:
              schema:
                type: object
                required: [id, name]
                properties:
                  id:
                    type: integer
                  name:
                    type: string
              examples:
                SUCCESS:
                  value:
                    id: 202
                    name: keyboard
