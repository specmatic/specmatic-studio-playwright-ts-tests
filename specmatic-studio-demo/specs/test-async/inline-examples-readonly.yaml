asyncapi: 3.0.0
info:
  title: Inline Examples Readonly Async API
  version: "1.0.0"
servers:
  kafka:
    host: localhost:9092
    protocol: kafka
channels:
  orders:
    address: orders
    messages:
      order.message:
        $ref: "#/components/messages/Order"
operations:
  receiveOrder:
    action: receive
    channel:
      $ref: "#/channels/orders"
    messages:
      - $ref: "#/channels/orders/messages/order.message"
components:
  messages:
    Order:
      name: Order
      title: Order message
      contentType: application/json
      examples:
        - name: NewOrder
          headers:
            requestId: req-101
          payload:
            id: 101
            status: created
        - name: CancelledOrder
          headers:
            requestId: req-202
          payload:
            id: 202
            status: cancelled
        - name: InvalidOrder
          headers:
            requestId: req-303
          payload:
            id: 303
            status: rejected
      headers:
        type: object
        required: [requestId]
        properties:
          requestId:
            type: string
      payload:
        type: object
        required: [id, status]
        properties:
          id:
            type: integer
          status:
            type: string
            enum: [created, cancelled]
