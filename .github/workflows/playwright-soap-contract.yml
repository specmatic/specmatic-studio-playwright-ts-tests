name: Studio - SOAP Contract Tests

run-name: ${{ inputs.orchestrator_run_suffix && format('Studio SOAP Contract Tests - {0}', inputs.orchestrator_run_suffix) || github.workflow }}
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  execute-soap-contract-tests:
    uses: ./.github/workflows/playwright-test-group.yml
    with:
      test_path: specs/soap/execute-contract-tests
      artifact_name: execute-contract-tests-soap
      group_name: SOAP Contract
      enterprise_artifact_url: ${{ inputs.enterprise_artifact_url || '' }}
      orchestrator_disable_visual: ${{ inputs.orchestrator_disable_visual }}
      orchestrator_run_suffix: ${{ inputs.orchestrator_run_suffix }}
    secrets:
      APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_API_KEY }}
      SPECMATIC_LICENSE_KEY: ${{ secrets.SPECMATIC_LICENSE_KEY }}
