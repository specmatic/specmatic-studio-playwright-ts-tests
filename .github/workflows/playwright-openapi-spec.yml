name: Studio - OpenAPI Spec Tests
on:
  workflow_dispatch:
    inputs:
      enterprise_artifact_url:
        description: Specmatic Enterprise snapshot JAR URL
        required: false
        type: string
      specmatic_jar_url:
        description: Specmatic Enterprise artifact URL
        required: false
        type: string
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  update-service-spec:
    uses: ./.github/workflows/playwright-test-group.yml
    with:
      test_path: specs/openapi/update-service-spec
      artifact_name: update-service-spec
      group_name: Spec
      enterprise_artifact_url: ${{ inputs.enterprise_artifact_url || inputs.specmatic_jar_url || '' }}
    secrets:
      APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_API_KEY }}
      SPECMATIC_LICENSE_KEY: ${{ secrets.SPECMATIC_LICENSE_KEY }}
