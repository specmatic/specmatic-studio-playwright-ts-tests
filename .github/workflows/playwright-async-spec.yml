name: Studio - Async Spec Tests

run-name: ${{ inputs.orchestrator_run_number && format('Studio Async Spec Tests - Orchestrator {0}', inputs.orchestrator_run_number) || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      enterprise_artifact_url:
        description: Specmatic Enterprise snapshot JAR URL
        required: false
        type: string
      orchestrator_disable_visual:
        required: false
        type: string
        default: "true"
      orchestrator_run_number:
        required: false
        type: string
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  update-service-spec:
    uses: ./.github/workflows/playwright-test-group.yml
    with:
      test_path: specs/async/update-service-spec
      artifact_name: update-service-spec
      group_name: Spec
      enterprise_artifact_url: ${{ inputs.enterprise_artifact_url || '' }}
      orchestrator_disable_visual: ${{ inputs.orchestrator_disable_visual }}
      orchestrator_run_number: ${{ inputs.orchestrator_run_number }}
    secrets:
      APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_API_KEY }}
      SPECMATIC_LICENSE_KEY: ${{ secrets.SPECMATIC_LICENSE_KEY }}
