name: Studio - Async Contract Tests
on:
  workflow_dispatch:
    inputs:
      enterprise_artifact_url:
        description: Specmatic Enterprise snapshot JAR URL
        required: false
        type: string
      orchestrator_disable_visual:
        required: false
        type: string
        default: "true"
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  execute-async-contract-tests:
    uses: ./.github/workflows/playwright-test-group.yml
    with:
      test_path: specs/async/execute-contract-tests
      artifact_name: execute-contract-tests-async
      group_name: Async Contract
      enterprise_artifact_url: ${{ inputs.enterprise_artifact_url || '' }}
      orchestrator_disable_visual: ${{ inputs.orchestrator_disable_visual }}
    secrets:
      APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_API_KEY }}
      SPECMATIC_LICENSE_KEY: ${{ secrets.SPECMATIC_LICENSE_KEY }}
