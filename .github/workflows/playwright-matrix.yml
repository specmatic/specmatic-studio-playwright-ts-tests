name: Studio - Matrix Playwright Tests

run-name: ${{ inputs.orchestrator_run_suffix && format('Studio Matrix Playwright Tests - {0}', inputs.orchestrator_run_suffix) || github.workflow }}

on:
  workflow_dispatch:
    inputs:
      enterprise_artifact_url:
        description: Specmatic Enterprise snapshot JAR URL or LATEST selector
        required: false
        type: string
      orchestrator_disable_visual:
        required: false
        type: string
        default: "true"
      orchestrator_run_suffix:
        required: false
        type: string
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  prepare-enterprise-jar:
    name: Prepare Enterprise JAR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      resolved_artifact_url: ${{ steps.resolve_artifact_url.outputs.resolved_artifact_url }}
      prepared_jar_artifact_name: ${{ steps.compute_artifact_name.outputs.prepared_jar_artifact_name }}
    steps:
      - name: Compute prepared JAR artifact name
        id: compute_artifact_name
        run: echo "prepared_jar_artifact_name=enterprise-jar-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: ${{ inputs.enterprise_artifact_url != '' }}
      - uses: actions/setup-node@v4
        if: ${{ inputs.enterprise_artifact_url != '' }}
        with:
          node-version: lts/*
      - name: Install npm dependencies for JAR preparation
        if: ${{ inputs.enterprise_artifact_url != '' }}
        run: npm ci
      - name: Resolve Enterprise JAR URL
        if: ${{ inputs.enterprise_artifact_url != '' }}
        id: resolve_artifact_url
        env:
          ENTERPRISE_ARTIFACT_URL: ${{ inputs.enterprise_artifact_url }}
          ENTERPRISE_ARTIFACT_DOWNLOAD_TIMEOUT_MS: "180000"
          ENTERPRISE_ARTIFACT_DOWNLOAD_RETRIES: "5"
        run: |
          resolved_url="$(node utils/specmatic-studio-runtime.js resolved-url | tail -n 1)"
          echo "Resolved Enterprise JAR URL: $resolved_url"
          echo "resolved_artifact_url=$resolved_url" >> "$GITHUB_OUTPUT"
      - name: Download Enterprise JAR once
        if: ${{ inputs.enterprise_artifact_url != '' }}
        env:
          ENTERPRISE_ARTIFACT_URL: ${{ steps.resolve_artifact_url.outputs.resolved_artifact_url }}
          ENTERPRISE_ARTIFACT_DOWNLOAD_TIMEOUT_MS: "180000"
          ENTERPRISE_ARTIFACT_DOWNLOAD_RETRIES: "5"
        run: |
          mkdir -p temp
          node utils/specmatic-studio-runtime.js download
          ls -la temp
      - name: Upload prepared Enterprise JAR
        if: ${{ inputs.enterprise_artifact_url != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.compute_artifact_name.outputs.prepared_jar_artifact_name }}
          path: temp/*.jar
          retention-days: 1

  matrix-tests:
    name: ${{ matrix.group.workflow_name }}
    needs: prepare-enterprise-jar
    strategy:
      fail-fast: false
      matrix:
        group:
          - workflow_name: OpenAPI Examples
            test_path: specs/openapi/generate-valid-examples
            artifact_name: generate-valid-examples
            group_name: OpenAPI Examples
          - workflow_name: OpenAPI Dictionary
            test_path: specs/openapi/dictionary
            artifact_name: generate-dictionary
            group_name: OpenAPI Dictionary
          - workflow_name: OpenAPI Contract
            test_path: specs/openapi/execute-contract-tests
            artifact_name: execute-contract-tests
            group_name: Contract
          - workflow_name: OpenAPI Spec
            test_path: specs/openapi/update-service-spec
            artifact_name: openapi-update-service-spec
            group_name: OpenAPI Spec
          - workflow_name: OpenAPI Mock
            test_path: specs/openapi/run-mock-server
            artifact_name: run-mock-server
            group_name: OpenAPI Mock
          - workflow_name: Config
            test_path: specs/config/service-spec-config
            artifact_name: config
            group_name: Config
          - workflow_name: Async Spec
            test_path: specs/async/update-service-spec
            artifact_name: async-update-service-spec
            group_name: Async Spec
          - workflow_name: Async Mock
            test_path: specs/async/run-mock-server
            artifact_name: run-async-mock-server
            group_name: Async Mock
          - workflow_name: Async Contract
            test_path: specs/async/execute-contract-tests
            artifact_name: execute-contract-tests-async
            group_name: Async Contract
          - workflow_name: Proxy
            test_path: specs/proxy
            artifact_name: proxy
            group_name: Proxy
          - workflow_name: SOAP Spec
            test_path: specs/soap/update-service-spec
            artifact_name: soap-update-service-spec
            group_name: SOAP Spec
          - workflow_name: SOAP Mock
            test_path: specs/soap/run-mock-server
            artifact_name: run-soap-mock-server
            group_name: SOAP Mock
          - workflow_name: SOAP Contract
            test_path: specs/soap/execute-contract-tests
            artifact_name: execute-contract-tests-soap
            group_name: SOAP Contract
    uses: ./.github/workflows/playwright-test-group.yml
    with:
      test_path: ${{ matrix.group.test_path }}
      artifact_name: ${{ matrix.group.artifact_name }}
      group_name: ${{ matrix.group.group_name }}
      enterprise_artifact_url: ${{ needs.prepare-enterprise-jar.outputs.resolved_artifact_url }}
      prepared_jar_artifact_name: ${{ needs.prepare-enterprise-jar.outputs.prepared_jar_artifact_name }}
      orchestrator_disable_visual: ${{ inputs.orchestrator_disable_visual }}
      orchestrator_run_suffix: ${{ inputs.orchestrator_run_suffix }}
    secrets:
      APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_API_KEY }}
      SPECMATIC_LICENSE_KEY: ${{ secrets.SPECMATIC_LICENSE_KEY }}
