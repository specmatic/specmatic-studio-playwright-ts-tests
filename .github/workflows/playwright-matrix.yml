name: Studio - Matrix Playwright Tests

run-name: ${{ inputs.orchestrator_run_suffix && format('Studio Matrix Playwright Tests - {0}', inputs.orchestrator_run_suffix) || github.workflow }}

on:
  workflow_dispatch:
    inputs:
      enterprise_artifact_url:
        description: Specmatic Enterprise snapshot JAR URL or LATEST selector
        required: false
        type: string
      orchestrator_disable_visual:
        required: false
        type: string
        default: "true"
      orchestrator_run_suffix:
        required: false
        type: string
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  actions: write

jobs:
  prepare-enterprise-jar:
    name: Prepare Enterprise JAR
    if: ${{ inputs.enterprise_artifact_url != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CMD_TIMEOUT_SHORT: 300
      CMD_TIMEOUT_MEDIUM: 600
      CMD_TIMEOUT_LONG: 1800
    outputs:
      resolved_artifact_url: ${{ steps.resolve_artifact_url.outputs.resolved_artifact_url }}
      prepared_jar_artifact_name: ${{ steps.compute_artifact_name.outputs.prepared_jar_artifact_name }}
    steps:
      - name: Compute prepared JAR artifact name
        id: compute_artifact_name
        run: echo "prepared_jar_artifact_name=enterprise-jar-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install npm dependencies for JAR preparation
        run: timeout "${CMD_TIMEOUT_MEDIUM}" npm ci
      - name: Resolve Enterprise JAR URL
        id: resolve_artifact_url
        env:
          ENTERPRISE_ARTIFACT_URL: ${{ inputs.enterprise_artifact_url }}
          ENTERPRISE_ARTIFACT_DOWNLOAD_TIMEOUT_MS: "180000"
          ENTERPRISE_ARTIFACT_DOWNLOAD_RETRIES: "5"
        run: bash scripts/github/resolve-enterprise-jar-url.sh
      - name: Download Enterprise JAR once
        env:
          ENTERPRISE_ARTIFACT_URL: ${{ steps.resolve_artifact_url.outputs.resolved_artifact_url }}
          ENTERPRISE_ARTIFACT_DOWNLOAD_TIMEOUT_MS: "180000"
          ENTERPRISE_ARTIFACT_DOWNLOAD_RETRIES: "5"
        run: timeout "${CMD_TIMEOUT_LONG}" bash scripts/github/download-enterprise-jar.sh
      - name: Upload prepared Enterprise JAR
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.compute_artifact_name.outputs.prepared_jar_artifact_name }}
          path: temp/*.jar
          retention-days: 1

  matrix-tests:
    name: ${{ matrix.group.workflow_name }}
    runs-on: ubuntu-latest
    needs: prepare-enterprise-jar
    if: ${{ always() && (needs.prepare-enterprise-jar.result == 'success' || needs.prepare-enterprise-jar.result == 'skipped') }}
    timeout-minutes: 60
    env:
      CMD_TIMEOUT_SHORT: 300
      CMD_TIMEOUT_MEDIUM: 600
      CMD_TIMEOUT_LONG: 1800
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      CHROME_EXECUTABLE_PATH: /usr/bin/google-chrome
    strategy:
      fail-fast: false
      matrix:
        group:
          # - workflow_name: OpenAPI Examples
          #   test_path: specs/openapi/generate-valid-examples
          #   artifact_name: generate-valid-examples
          #   group_name: OpenAPI Examples
          # - workflow_name: OpenAPI Dictionary
          #   test_path: specs/openapi/dictionary
          #   artifact_name: generate-dictionary
          #   group_name: OpenAPI Dictionary
          - workflow_name: OpenAPI Contract
            test_path: specs/openapi/execute-contract-tests
            artifact_name: execute-contract-tests
            group_name: OpenAPI Contract
          - workflow_name: OpenAPI Spec
            test_path: specs/openapi/update-service-spec
            artifact_name: openapi-update-service-spec
            group_name: OpenAPI Spec
          - workflow_name: OpenAPI Mock
            test_path: specs/openapi/run-mock-server
            artifact_name: run-mock-server
            group_name: OpenAPI Mock
          - workflow_name: Config
            test_path: specs/config/service-spec-config
            artifact_name: config
            group_name: Config
          - workflow_name: Async Spec
            test_path: specs/async/update-service-spec
            artifact_name: async-update-service-spec
            group_name: Async Spec
          - workflow_name: Async Mock
            test_path: specs/async/run-mock-server
            artifact_name: run-async-mock-server
            group_name: Async Mock
          - workflow_name: Async Contract
            test_path: specs/async/execute-contract-tests
            artifact_name: execute-contract-tests-async
            group_name: Async Contract
          # - workflow_name: Proxy
          #   test_path: specs/proxy
          #   artifact_name: proxy
          #   group_name: Proxy
          - workflow_name: SOAP Spec
            test_path: specs/soap/update-service-spec
            artifact_name: soap-update-service-spec
            group_name: SOAP Spec
          - workflow_name: SOAP Mock
            test_path: specs/soap/run-mock-server
            artifact_name: run-soap-mock-server
            group_name: SOAP Mock
          - workflow_name: SOAP Contract
            test_path: specs/soap/execute-contract-tests
            artifact_name: execute-contract-tests-soap
            group_name: SOAP Contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Verify system Chrome
        run: |
          which google-chrome
          google-chrome --version
      - name: Install dependencies and set up environment for ${{ matrix.group.workflow_name }}
        run: |
          timeout "${CMD_TIMEOUT_MEDIUM}" npm ci
          timeout "${CMD_TIMEOUT_MEDIUM}" sudo apt-get update
          timeout "${CMD_TIMEOUT_MEDIUM}" sudo apt-get install -y libxml2-utils
          # Install only Linux deps; browser binary comes from the runner image.
          timeout "${CMD_TIMEOUT_LONG}" npx playwright install-deps chromium
          mkdir -p ~/.specmatic
          echo "${{ secrets.SPECMATIC_LICENSE_KEY }}" > ~/.specmatic/specmatic-license.txt
      - name: Print orchestrator info
        run: echo "Triggered by orchestrator run ${{ inputs.orchestrator_run_suffix }}"
      - name: Download prepared Enterprise JAR
        if: ${{ needs.prepare-enterprise-jar.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare-enterprise-jar.outputs.prepared_jar_artifact_name }}
          path: temp

      - name: Pull latest Specmatic Docker image
        if: ${{ needs.prepare-enterprise-jar.result == 'skipped' }}
        run: timeout "${CMD_TIMEOUT_LONG}" docker pull specmatic/enterprise:latest
      - name: Configure Enterprise JAR networking
        if: ${{ needs.prepare-enterprise-jar.result == 'success' }}
        run: |
          echo "127.0.0.1 order-bff order-api inventory-api studio" | sudo tee -a /etc/hosts
          cat > /tmp/docker-compose.enterprise-jar.yml <<'EOF'
          services:
            order-bff:
              environment:
                KAFKA_BOOTSTRAP_SERVERS: host.docker.internal:9092
              extra_hosts:
                - "host.docker.internal:host-gateway"
          EOF
      - name: Start support services for Enterprise JAR
        if: ${{ needs.prepare-enterprise-jar.result == 'success' }}
        run: |
          for cname in order-bff order-api inventory-api; do
            if docker ps -a -q -f name="^/${cname}$" | grep .; then
              timeout "${CMD_TIMEOUT_SHORT}" docker rm -f "$cname"
            fi
          done
          timeout "${CMD_TIMEOUT_MEDIUM}" docker compose \
            -p specmatic-studio-playwright \
            -f specmatic-studio-demo/docker-compose.yaml \
            -f /tmp/docker-compose.enterprise-jar.yml \
            up -d order-bff order-api inventory-api
      - name: Wait for support services to be healthy
        if: ${{ needs.prepare-enterprise-jar.result == 'success' }}
        run: |
          for url in \
            "http://127.0.0.1:8095/health" \
            "http://127.0.0.1:8090/products" \
            "http://127.0.0.1:8080/health"; do
            echo "Waiting for $url"
            for i in $(seq 1 30); do
              if curl -sf "$url" > /dev/null 2>&1; then
                echo "$url is up"
                break
              fi
              sleep 4
              if [ "$i" -eq 30 ]; then
                echo "Timed out waiting for $url"
                exit 1
              fi
            done
          done
      - name: Run Playwright tests for ${{ matrix.group.workflow_name }}
        id: playwright_tests
        timeout-minutes: 50
        env:
          APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_API_KEY }}
          GROUP_NAME: ${{ matrix.group.group_name }}
          ENTERPRISE_ARTIFACT_URL: ${{ needs.prepare-enterprise-jar.outputs.resolved_artifact_url || '' }}
          ENTERPRISE_ARTIFACT_DOWNLOAD_TIMEOUT_MS: "180000"
          ENTERPRISE_ARTIFACT_DOWNLOAD_RETRIES: "5"
          SPECMATIC_STUDIO_WORKDIR: specmatic-studio-demo/specs
          ORCHESTRATOR_DISABLE_VISUAL: ${{ inputs.orchestrator_disable_visual }}
        run: |
          mkdir -p playwright-report
          mkdir -p studio-logs
          timeout "${CMD_TIMEOUT_LONG}" npx playwright test ${{ matrix.group.test_path }}
        continue-on-error: true
      - name: Capture Docker logs
        if: always()
        run: |
          mkdir -p docker-logs-workdir
          for cname in studio order-bff order-api inventory-api; do
            if docker ps -a -q -f name="^/${cname}$" | grep .; then
              timeout "${CMD_TIMEOUT_SHORT}" docker logs "$cname" > "docker-logs-workdir/${cname}.log" 2>&1 || true
            fi
          done
      - name: Prepare Playwright artifact
        if: always()
        env:
          PLAYWRIGHT_RUN_NAME: ${{ matrix.group.workflow_name }}
        run: timeout "${CMD_TIMEOUT_SHORT}" node utils/generate-failed-test-screenshots-summary.js
        continue-on-error: true
      - name: Remove large local-only files
        if: always()
        run: |
          rm -rf temp
          rm -f playwright-report/test-results.json
      - name: Upload Playwright artifact
        if: always()
        uses: actions/upload-artifact@v4
        id: upload_test_artifacts
        with:
          name: test-artifacts-${{ matrix.group.artifact_name }}-run-${{ github.run_id }}
          path: |
            docker-logs-workdir
            playwright-report
            studio-logs
            test-results
          retention-days: 30
      - name: Fail job if there are test failures
        if: always()
        run: |
          REPORT_PATH="playwright-report/junit-report.xml"
          PLAYWRIGHT_OUTCOME="${{ steps.playwright_tests.outcome }}"
          if [ ! -f "$REPORT_PATH" ]; then
            echo "JUnit report not found at $REPORT_PATH"
            exit 1
          fi
          TOTAL=$(xmllint --xpath 'string(sum(//testsuite/@tests))' "$REPORT_PATH")
          FAILURES=$(xmllint --xpath 'string(sum(//testsuite/@failures))' "$REPORT_PATH")
          ERRORS=$(xmllint --xpath 'string(sum(//testsuite/@errors))' "$REPORT_PATH")
          if [ "$PLAYWRIGHT_OUTCOME" != "success" ] && [ "$FAILURES" = "0" ] && [ "$ERRORS" = "0" ]; then
            echo "Playwright step failed before recording test failures. This usually means setup/global setup failed."
            exit 1
          fi
          if [ "$TOTAL" = "0" ]; then
            echo "No tests were recorded in $REPORT_PATH. Treating this as a setup failure."
            exit 1
          fi
          if [ "$FAILURES" != "0" ] || [ "$ERRORS" != "0" ]; then
            echo "Test failures or errors detected across all suites: failures=$FAILURES, errors=$ERRORS"
            exit 1
          fi
          echo "No test failures or errors detected. tests=$TOTAL"

  matrix-summary:
    name: Playwright Matrix Summary
    runs-on: ubuntu-latest
    needs: matrix-tests
    if: always()
    timeout-minutes: 20
    env:
      CMD_TIMEOUT_SHORT: 300
    steps:
      - uses: actions/checkout@v4
      - name: Download all compact Playwright artifacts
        uses: actions/download-artifact@v4
        with:
          path: matrix-artifacts
          pattern: test-artifacts-*-run-${{ github.run_id }}
      - name: Generate single matrix summary table
        run: timeout "${CMD_TIMEOUT_SHORT}" node utils/generate-matrix-summary.js

  cleanup-enterprise-jar-artifact:
    name: Cleanup Enterprise JAR Artifact
    runs-on: ubuntu-latest
    needs:
      - prepare-enterprise-jar
      - matrix-tests
      - matrix-summary
    if: ${{ always() && needs.prepare-enterprise-jar.result == 'success' }}
    timeout-minutes: 10
    env:
      CMD_TIMEOUT_SHORT: 300
    steps:
      - uses: actions/checkout@v4
      - name: Delete prepared Enterprise JAR artifact
        env:
          PREPARED_JAR_ARTIFACT_NAME: ${{ needs.prepare-enterprise-jar.outputs.prepared_jar_artifact_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: timeout "${CMD_TIMEOUT_SHORT}" node utils/delete-workflow-artifact.js
