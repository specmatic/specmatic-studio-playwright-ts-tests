name: Studio - SOAP Mock Tests

run-name: ${{ inputs.orchestrator_run_suffix && format('Studio SOAP Mock Tests - {0}', inputs.orchestrator_run_suffix) || github.workflow }}
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  run-soap-mock-server:
    uses: ./.github/workflows/playwright-test-group.yml
    with:
      test_path: specs/soap/run-mock-server
      artifact_name: run-soap-mock-server
      group_name: SOAP Mock
      enterprise_artifact_url: ${{ inputs.enterprise_artifact_url || '' }}
      orchestrator_disable_visual: ${{ inputs.orchestrator_disable_visual }}
      orchestrator_run_suffix: ${{ inputs.orchestrator_run_suffix }}
    secrets:
      APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_API_KEY }}
      SPECMATIC_LICENSE_KEY: ${{ secrets.SPECMATIC_LICENSE_KEY }}
